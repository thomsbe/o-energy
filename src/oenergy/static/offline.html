<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · o-energy</title>
  <meta name="theme-color" content="#0e1512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (function () {
      var stored = localStorage.getItem('oenergy-theme');
      if (stored) { document.documentElement.setAttribute('data-theme', stored); }
    })();
  </script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand"><span class="brand-mark">🐙</span><span>o-energy</span></div>
    <h1>Keine Verbindung</h1>
    <p class="login-sub">Die Daten konnten nicht geladen werden - vermutlich ist das Gerät offline.</p>
    <a class="btn btn-primary" href="/">Erneut versuchen</a>
  </main>
</body>
</html>
