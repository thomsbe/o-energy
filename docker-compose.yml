services:
  oenergy:
    build: .
    image: o-energy:latest
    container_name: o-energy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: sqlite:////data/o-energy.db
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
      LOG_FILE: "${LOG_FILE:-/data/logs/o-energy.log}"
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    ports:
      # Auf allen Interfaces: der Cloudflare-Tunnel läuft als eigener
      # Container und erreicht den Dienst über das Docker-Netz. Eine Bindung
      # auf 127.0.0.1 würde den Tunnel aussperren (502). Wer den Tunnel auf
      # dem Host laufen lässt, kann hier "127.0.0.1:8000:8000" setzen.
      - "8000:8000"

  # Optionaler Worker ohne Web-Server.
  # Enable mit:  docker compose --profile worker up -d
  oenergy-sync:
    build: .
    image: o-energy:latest
    container_name: o-energy-sync
    restart: unless-stopped
    profiles: ["worker"]
    env_file:
      - .env
    environment:
      DB_URL: sqlite:////data/o-energy.db
      SCHEDULER_ENABLED: "false"
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    command: ["sh", "-c", "while true; do oenergy sync all; sleep 900; done"]

  # Optionaler Cloudflare-Tunnel, wenn cloudflared nicht auf dem Host läuft.
  # Aktivieren mit:  docker compose --profile tunnel up -d
  # Voraussetzung: TUNNEL_TOKEN=<Token aus Cloudflare Zero Trust> in der .env
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: o-energy-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - oenergy
