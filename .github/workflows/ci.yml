name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests und Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv einrichten
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: uv sync --all-extras --dev

      - name: Linting
        run: uv run ruff check .

      - name: Formatierung
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Paket bauen
        run: uv build

  secrets:
    name: Secret-Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # die ganze Historie - Geheimnisse landen oft in alten Commits
          fetch-depth: 0

      - name: Auf versehentlich committete Geheimnisse prüfen (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # in einem öffentlichen Repo reichen die eigenen Commits
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t o-energy:ci .
