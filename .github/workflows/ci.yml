name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests und Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: uv einrichten
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: uv sync --all-extras --dev

      - name: Linting
        run: uv run ruff check .

      - name: Formatierung
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Paket bauen
        run: uv build

  secrets:
    name: Secret-Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # die ganze Historie - Geheimnisse landen oft in alten Commits
          fetch-depth: 0

      - name: Auf versehentlich committete Geheimnisse prüfen (gitleaks)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # in einem öffentlichen Repo reichen die eigenen Commits
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Image bauen
        run: docker build -t o-energy:ci .
